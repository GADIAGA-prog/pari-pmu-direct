name: Deploy trading journal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - trading-journal.html
      - trading-journal.css
      - trading-journal.js
      - manifest.webmanifest
      - service-worker.js
      - icons/**
      - .github/workflows/deploy-trading-journal.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trading-journal-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/icons
          cp trading-journal.html trading-journal.css trading-journal.js manifest.webmanifest service-worker.js _site/
          cp icons/icon.svg icons/icon-192.png icons/icon-512.png _site/icons/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
